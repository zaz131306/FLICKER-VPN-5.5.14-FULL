name: Run Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java / JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find project root and run tests
        run: |
          # Ищем папку, где лежит build.gradle или settings.gradle
          PROJECT_DIR=$(find . -name "build.gradle" -o -name "settings.gradle" -maxdepth 3 | head -n 1 | xargs dirname)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "Error: build.gradle or settings.gradle not found anywhere!"
            exit 1
          fi
          
          echo "Found project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Если gradle wrapper отсутствует, создаем его
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper
          fi
          
          chmod +x gradlew
          ./gradlew test --stacktrace

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
