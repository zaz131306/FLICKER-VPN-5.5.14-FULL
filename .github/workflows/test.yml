name: Run Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java / JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # Убрали cache: gradle, чтобы action не падал при поиске путей

      - name: Check repository structure
        run: |
          echo "Current directory structure:"
          ls -la
          find . -maxdepth 3 -name "gradlew" -o -name "build.gradle" -o -name "settings.gradle"

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          elif [ -f "$(find . -name gradlew | head -n 1)" ]; then
            chmod +x $(find . -name gradlew | head -n 1)
          else
            echo "gradlew not found in root!"
          fi

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
